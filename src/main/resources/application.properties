quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=gardeners
quarkus.datasource.password=gardeners
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5435/gardeners
quarkus.hibernate-orm.database.generation=update
