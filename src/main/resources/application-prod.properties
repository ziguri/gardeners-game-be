quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_JDBC_URL}

# Connection pool
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=5

# Connection timeouts
quarkus.datasource.jdbc.acquisition-timeout=30S
quarkus.datasource.jdbc.login-timeout=30S

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=validate

quarkus.hibernate-orm.database.generation=update
quarkus.http.auth.basic=true
quarkus.http.cors=true
quarkus.http.cors.origins=https://gardeners-game-fe.orlandoluisneves.workers.dev
quarkus.http.cors.headers=authorization,content-type
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

quarkus.http.port=${PORT:8080}
